[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "rowgate"
version = "0.2.0"
description = "Data contracts and quality gates for Polars: quarantine bad rows with reasons, block bad batches, and write reports people can read."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dei'Marlon Scisney", email = "info@thedataguys.org" }]
requires-python = ">=3.11"
dependencies = ["polars>=1.0"]
keywords = ["polars", "data-quality", "data-contracts", "data-engineering", "etl", "validation", "data-validation", "quarantine", "dataframe", "schema", "data-pipelines", "data-testing", "quality-gate"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0", "pyarrow>=14"]
duckdb = ["duckdb>=1.0"]
all = ["pandas>=2.0", "pyarrow>=14", "duckdb>=1.0"]
dev = ["pytest>=8", "pyarrow", "ruff>=0.6", "pandas>=2.0", "duckdb>=1.0"]
docs = ["mkdocs-material>=9.5"]

[project.scripts]
rowgate = "rowgate.cli:main"

[project.urls]
Homepage = "https://github.com/DTheDataGuy/rowgate"
PyPI = "https://pypi.org/project/rowgate/"
Documentation = "https://dthedataguy.github.io/rowgate/"
Source = "https://github.com/DTheDataGuy/rowgate"
Issues = "https://github.com/DTheDataGuy/rowgate/issues"
Changelog = "https://github.com/DTheDataGuy/rowgate/blob/main/CHANGELOG.md"
"The Data Guys" = "https://www.thedataguys.org"

[tool.hatch.build.targets.wheel]
packages = ["src/rowgate"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
